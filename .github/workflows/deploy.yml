name: Deploy MkDocs

# ✅ LIVE sinds 1/11/2026, op Dominiques woord: repo publiek, Pages aan (bron: GitHub Actions, domein docs.credimatch.be),
# en de uitrol bij elke push naar main, zoals bij de andere drie. Bij elke push BOUWT dit de site strikt (een dode link
# of een dood anker laat de bouw falen). Tot dan liep de uitrol enkel op een handmatige start (workflow_dispatch).
# robots.txt blijft DICHT tot de lancering (plak 1, keuze D).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Vaste versies — zie requirements.txt.
      - run: pip install -r requirements.txt
      # De gedeelde hook voor zoeken per taal (mkdocs.yml → _appkit/tools/docs-site/zoeken_per_taal.py) woont in
      # adm-appkit, en die repo is privé: meelezen met het repo-geheim ADM_APPKIT_LEZEN (fine-grained token, enkel
      # adm-appkit, Contents: Read-only — NOTEER DE VERVALDATUM). Zonder deze stap vindt mkdocs de hook niet en
      # faalt de bouw; de vorige versie blijft dan online. Zoals nimble-docs en cleanops-docs (07/11/2026).
      # Komt de eerste film, voeg dan tools/filmgenerator toe aan sparse-checkout (zie CLAUDE.md).
      - uses: actions/checkout@v4
        with:
          repository: ADM-Concept/adm-appkit
          token: ${{ secrets.ADM_APPKIT_LEZEN }}
          path: _appkit
          sparse-checkout: tools/docs-site
      - run: mkdocs build --strict
      # ⚠️ NA de bouw: zoekt elke taal enkel in haar eigen pagina's? De hook faalt luid bij alles wat hij ziet, maar niet
      # wanneer hij er niet is — haalt iemand hem uit mkdocs.yml, dan mengt het zoekvak stil weer NL en FR (zo stond het
      # live tot 07/11/2026). Deze meet de GEBOUWDE site en mag de uitrol TEGENHOUDEN.
      - name: Zoeken per taal controleren
        run: python3 _appkit/tools/docs-site/check-zoeken.py site
      # Staat elk beeld uit de bron ook als <img> in de gebouwde site? Bij Nimble en CreditSoft verdwenen op 19/10/2026 alle
      # schermafdrukken bij het bouwen (selectolax 1.0.1, zie requirements.txt) terwijl alle stappen groen bleven. Deze mag de
      # uitrol TEGENHOUDEN.
      - name: Beelden controleren (bron tegen gebouwde site)
        run: python3 tools/check-beelden.py site
      # Nog niet aan, en waarom (zie CLAUDE.md): de gedeelde filmhook en de filmcontrole uit adm-appkit vanaf de eerste
      # film. Het meelezen van adm-appkit (geheim ADM_APPKIT_LEZEN) staat er sinds 07/11/2026 al, voor zoeken per taal.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
